name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudDragonStudio-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload APK Release Asset
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk CloudDragonStudio.apk
          if ! gh release view v1.0.0 >/dev/null 2>&1; then
            gh release create v1.0.0 CloudDragonStudio.apk \
              --title "Cloud Dragon Studio Android v1.0.0" \
              --notes "Cloud Dragon Studio Android APK Release." || gh release upload v1.0.0 CloudDragonStudio.apk --clobber
          else
            gh release edit v1.0.0 \
              --title "Cloud Dragon Studio Android v1.0.0" \
              --notes "Cloud Dragon Studio Android APK Release." || true
            gh release upload v1.0.0 CloudDragonStudio.apk --clobber
          fi
        env:
          GH_TOKEN: ${{ github.token }}
